name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts python3-pytest python3-gi gir1.2-gtk-3.0 \
            desktop-file-utils lintian apt-utils gnupg

      - name: Build the package
        run: make deb

      - name: Lintian
        run: lintian dist/*.deb

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.deb --clobber

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Get the apt repo branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Publish to the apt repo
        env:
          APT_SIGNING_KEY: ${{ vars.APT_SIGNING_KEY }}
        run: scripts/publish-apt.sh dist/*.deb site

      - name: Push the apt repo
        working-directory: site
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet \
            || git commit -m "chore: publish gtasks-panel $VERSION to the apt repo"
          git push
